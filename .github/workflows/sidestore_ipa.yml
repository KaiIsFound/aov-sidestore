# File: .github/workflows/sidestore_ipa.yml
# Chức năng:
# 1. Tự động vô hiệu hóa kiểm tra Key BaoNTQ trong IPA 423MB mà không gây văng game
# 2. Nhúng OllieAOV.dylib (Zero-Crash Engine + Unlock All Skin + ESP Chấp Tố Cáo)

name: Build Zero-Crash & No-Key IPA For SideStore

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: 'Dán link Google Drive của file IPA 423MB hoặc IPA gốc vào đây'
        required: true
        default: ''

jobs:
  pack-ipa-for-sidestore:
    runs-on: macos-14

    steps:
      - name: 1. Nạp dữ liệu từ kho chứa
        uses: actions/checkout@v4

      - name: 2. Cài đặt công cụ (ldid, insert_dylib & gdown)
        run: |
          brew install ldid wget
          python3 -m pip install --upgrade pip --break-system-packages || true
          python3 -m pip install --upgrade gdown --break-system-packages || pip3 install gdown
          
          git clone https://github.com/Tyilo/insert_dylib.git
          clang insert_dylib/insert_dylib/main.c -o /usr/local/bin/insert_dylib -framework Foundation

      - name: 3. Tải ImGui Metal
        run: |
          mkdir -p include imgui
          git clone --depth 1 https://github.com/ocornut/imgui.git imgui_src
          cp imgui_src/*.h imgui_src/*.cpp imgui_src/backends/imgui_impl_metal.* imgui/

      - name: 4. Biên dịch OllieAOV.dylib (Bypass Key + Zero-Crash + Unlock All Skin)
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          CLANG_BIN=$(xcrun --sdk iphoneos --find clang++)
          
          $CLANG_BIN -arch arm64 -isysroot "$SDK_PATH" \
            -std=c++20 -O3 -dynamiclib \
            -fobjc-arc -fvisibility=hidden \
            -Wno-deprecated-declarations -Wno-unused-parameter \
            -I./include -I./imgui \
            OllieAOV.mm \
            imgui/imgui.cpp imgui/imgui_draw.cpp imgui/imgui_tables.cpp imgui/imgui_widgets.cpp imgui/imgui_impl_metal.mm \
            -framework Foundation -framework UIKit -framework Metal -framework MetalKit -framework CoreGraphics \
            -install_name @executable_path/Frameworks/OllieAOV.dylib \
            -o OllieAOV.dylib
            
          ldid -S OllieAOV.dylib
          ls -lh OllieAOV.dylib

      - name: 5. Tải file IPA từ Google Drive
        run: |
          RAW_URL="${{ github.event.inputs.ipa_url }}"
          FILE_ID=$(echo "$RAW_URL" | sed -n 's/.*\/d\/\([a-zA-Z0-9_-]*\).*/\1/p')
          if [ -z "$FILE_ID" ]; then
            FILE_ID="$RAW_URL"
          fi
          
          python3 -m gdown "https://drive.google.com/uc?id=${FILE_ID}&export=download" -O BaseGame.ipa --fuzzy
          ls -lh BaseGame.ipa

      - name: 6. Vô hiệu hóa Key Lock BaoNTQ, Chống xung đột văng game & Tiêm OllieAOV.dylib
        run: |
          mkdir -p build_ipa
          
          if file BaseGame.ipa | grep -qE "Zip archive|IPA"; then
            unzip -q BaseGame.ipa -d build_ipa
            APP_DIR=$(find build_ipa/Payload -name "*.app" -type d | head -n 1)
            mkdir -p "$APP_DIR/Frameworks"
            
            echo "=== Kiểm tra các Dylib có sẵn trong IPA ==="
            ls -la "$APP_DIR/Frameworks" || true
            
            # Copy OllieAOV.dylib (chứa bộ Bypass NSURLSession + Chặn Popup Key + SafeRead) vào Frameworks
            cp OllieAOV.dylib "$APP_DIR/Frameworks/"
            
            EXEC_NAME=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP_DIR/Info.plist")
            /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier com.garena.game.kgvn.sidestore" "$APP_DIR/Info.plist" || true
            /usr/libexec/PlistBuddy -c "Add :UIFileSharingEnabled bool true" "$APP_DIR/Info.plist" || true
            
            # Xóa các thư mục tiện ích phụ gây văng trên SideStore
            rm -rf "$APP_DIR/PlugIns" "$APP_DIR/Watch" "$APP_DIR/_CodeSignature" || true
            
            # Tiêm OllieAOV.dylib nạp ĐẦU TIÊN để chặn đứng bảng hỏi Key của các dylib khác
            insert_dylib --all-yes --inplace --weak "@executable_path/Frameworks/OllieAOV.dylib" "$APP_DIR/$EXEC_NAME"
            
            # Ký đồng bộ quyền (Entitlements) cho toàn bộ Frameworks và Binary chính để chống văng lúc vào trận
            find "$APP_DIR/Frameworks" -name "*.dylib" -exec ldid -S {} \; || true
            find "$APP_DIR/Frameworks" -name "*.framework" -exec ldid -S {} \; || true
            ldid -S "$APP_DIR/$EXEC_NAME"
          else
            echo "LỖI: Hãy mở quyền chia sẻ công khai 'Bất kỳ ai có đường liên kết' cho file IPA trên Drive!"
            exit 1
          fi
          
          cd build_ipa
          zip -qr ../Ollie_AOV_SideStore_Ready.ipa Payload
          cd ..

      - name: 7. Xuất file IPA hoàn chỉnh cho SideStore
        uses: actions/upload-artifact@v4
        with:
          name: File-IPA-Cho-SideStore
          path: |
            Ollie_AOV_SideStore_Ready.ipa
            OllieAOV.dylib
