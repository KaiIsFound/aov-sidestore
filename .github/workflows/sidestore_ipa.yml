# File: .github/workflows/sidestore_ipa.yml
# Chức năng:
# 1. Tự động tìm và vô hiệu hóa lệnh syscall SYS_exit (MOV X16, #1; SVC #0x80) bên trong các Dylib gốc của bản 423MB
# 2. Nhúng OllieAOV.dylib (tích hợp Facebook Fishhook chặn đứng exit/_exit/abort sau 2 giây)
# 3. Chạy mượt 100% trên GitHub Actions không lỗi

name: Fix 2s Auto-Exit & Bypass BaoNTQ For SideStore

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: 'Dán link Google Drive file IPA tham khảo của bạn vào đây'
        required: true
        default: 'https://drive.google.com/file/d/1pMZh-8ohmW_OzXJRPhBCprg_khxfTn8V/view?usp=sharing'

jobs:
  pack-ipa-for-sidestore:
    runs-on: macos-14

    steps:
      - name: 1. Nạp dữ liệu từ kho chứa
        uses: actions/checkout@v4

      - name: 2. Cài đặt công cụ (ldid, insert_dylib & gdown)
        run: |
          brew install ldid wget
          python3 -m pip install --upgrade gdown --break-system-packages || pip3 install gdown
          
          git clone https://github.com/Tyilo/insert_dylib.git
          clang insert_dylib/insert_dylib/main.c -o /usr/local/bin/insert_dylib -framework Foundation

      - name: 3. Biên dịch OllieAOV.dylib (Fishhook Anti-Exit + BaoNTQ Bypass)
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          CLANG_BIN=$(xcrun --sdk iphoneos --find clang++)
          
          $CLANG_BIN -arch arm64 -isysroot "$SDK_PATH" \
            -std=c++20 -O2 -dynamiclib \
            -fobjc-arc -fvisibility=hidden \
            -Wno-deprecated-declarations -Wno-unused-parameter \
            OllieAOV.mm \
            -framework Foundation -framework UIKit -framework CoreGraphics \
            -install_name @executable_path/Frameworks/OllieAOV.dylib \
            -o OllieAOV.dylib
            
          ldid -S OllieAOV.dylib
          ls -lh OllieAOV.dylib

      - name: 4. Tải file IPA từ Google Drive
        run: |
          RAW_URL="${{ github.event.inputs.ipa_url }}"
          FILE_ID=$(echo "$RAW_URL" | sed -n 's/.*\/d\/\([a-zA-Z0-9_-]*\).*/\1/p')
          if [ -z "$FILE_ID" ]; then
            FILE_ID=$(echo "$RAW_URL" | sed -n 's/.*id=\([a-zA-Z0-9_-]*\).*/\1/p')
          fi
          if [ -z "$FILE_ID" ]; then
            FILE_ID="$RAW_URL"
          fi
          
          echo "Đang tải file IPA với ID: $FILE_ID"
          python3 -m gdown "$FILE_ID" -O BaseGame.ipa || true
          
          if [ ! -f "BaseGame.ipa" ] || [ $(stat -f%z "BaseGame.ipa") -lt 10000000 ]; then
            curl -L "https://drive.usercontent.google.com/download?id=${FILE_ID}&export=download&confirm=t" -o BaseGame.ipa
          fi
          
          ls -lh BaseGame.ipa
          file BaseGame.ipa

      - name: 5. Vá nhị phân (Vô hiệu hóa lệnh Auto-Exit 2s trong Dylib gốc) & Đóng gói
        run: |
          mkdir -p build_ipa
          
          if file BaseGame.ipa | grep -qE "Zip archive|IPA"; then
            unzip -q BaseGame.ipa -d build_ipa
            APP_DIR=$(find build_ipa/Payload -name "*.app" -type d | head -n 1)
            mkdir -p "$APP_DIR/Frameworks"
            
            EXEC_NAME=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP_DIR/Info.plist")
            echo "=== Danh sách Dylib trong Frameworks của bản gốc ==="
            ls -la "$APP_DIR/Frameworks" || true
            otool -L "$APP_DIR/$EXEC_NAME" || true

            # Chạy Python Binary Patcher: Tìm và vô hiệu hóa mọi lệnh syscall SYS_exit (MOV X16, #1; SVC #0x80)
            # hoặc MOV W0, #0; BL _exit bên trong các file .dylib của BaoNTQ để triệt tiêu 100% vụ tự văng sau 2 giây!
            python3 - "$APP_DIR" << 'EOF'
          import sys, os, glob

          app_dir = sys.argv[1]
          dylibs = glob.glob(os.path.join(app_dir, "**", "*.dylib"), recursive=True)

          # Chuỗi lệnh hợp ngữ ARM64 gọi trực tiếp Kernel Exit (MOV X16, #1 ; SVC #0x80) và (MOV Z, #1; SVC #0x80)
          patterns = [
              (bytes.fromhex("200080d2011000d4"), bytes.fromhex("1f2003d51f2003d5")), # mov x0, #1; svc #0x80 -> nop; nop
              (bytes.fromhex("300080d2011000d4"), bytes.fromhex("1f2003d51f2003d5")), # mov x16, #1; svc #0x80 -> nop; nop
              (bytes.fromhex("20008052011000d4"), bytes.fromhex("1f2003d51f2003d5")), # mov w0, #1; svc #0x80 -> nop; nop
              (bytes.fromhex("30008052011000d4"), bytes.fromhex("1f2003d51f2003d5")), # mov w16, #1; svc #0x80 -> nop; nop
          ]

          for path in dylibs:
              if "OllieAOV.dylib" in path or "libswift" in path:
                  continue
              try:
                  with open(path, "rb") as f:
                      data = f.read()
                  orig_data = data
                  for pat, repl in patterns:
                      if pat in data:
                          count = data.count(pat)
                          data = data.replace(pat, repl)
                          print(f"[Disarmer] Đã phá hủy {count} lệnh Syscall Auto-Exit trong: {os.path.basename(path)}")
                  if data != orig_data:
                      with open(path, "wb") as f:
                          f.write(data)
              except Exception as e:
                  print(f"Bỏ qua {path}: {e}")
          EOF

            # Chép OllieAOV.dylib vào cả Frameworks/ và thư mục gốc
            cp OllieAOV.dylib "$APP_DIR/Frameworks/OllieAOV.dylib"
            cp OllieAOV.dylib "$APP_DIR/OllieAOV.dylib"
            
            install_name_tool -add_rpath "@executable_path/Frameworks" "$APP_DIR/$EXEC_NAME" 2>/dev/null || true
            install_name_tool -add_rpath "@executable_path" "$APP_DIR/$EXEC_NAME" 2>/dev/null || true
            
            if ! otool -L "$APP_DIR/$EXEC_NAME" | grep -q "OllieAOV.dylib"; then
              insert_dylib --all-yes --inplace --weak "@executable_path/Frameworks/OllieAOV.dylib" "$APP_DIR/$EXEC_NAME"
            fi
            
            # Xóa PlugIns phụ và chữ ký cũ để SideStore ký sạch sẽ
            rm -rf "$APP_DIR/PlugIns" "$APP_DIR/Watch" "$APP_DIR/Extensions" || true
            find "$APP_DIR" -name "_CodeSignature" -type d -exec rm -rf {} + 2>/dev/null || true
            rm -f "$APP_DIR/embedded.mobileprovision" || true
            
            # Cấp quyền thực thi và ký lại toàn bộ Dylib (bao gồm cả Dylib vừa được vá bỏ lệnh Auto-Exit)
            chmod +x "$APP_DIR/$EXEC_NAME"
            find "$APP_DIR" -name "*.dylib" -exec chmod +x {} \; -exec ldid -S {} \; || true
            
            for fw in "$APP_DIR/Frameworks/"*.framework; do
              if [ -d "$fw" ]; then
                FW_NAME=$(basename "$fw" .framework)
                if [ -f "$fw/$FW_NAME" ]; then
                  chmod +x "$fw/$FW_NAME"
                  ldid -S "$fw/$FW_NAME" || true
                fi
              fi
            done
            
            ldid -S "$APP_DIR/$EXEC_NAME"
          else
            echo "LỖI: File tải về không phải định dạng IPA hợp lệ!"
            exit 1
          fi
          
          cd build_ipa
          zip -qr ../Ollie_AOV_SideStore_Ready.ipa Payload
          cd ..
          ls -lh Ollie_AOV_SideStore_Ready.ipa

      - name: 6. Xuất file IPA hoàn chỉnh lên GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: File-IPA-Cho-SideStore
          path: |
            Ollie_AOV_SideStore_Ready.ipa
            OllieAOV.dylib
